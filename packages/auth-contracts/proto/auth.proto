syntax = "proto3";

package appenglish.auth.v1;

service AuthService {
  rpc Register(RegisterRequest) returns (AuthReply);
  rpc Login(CredentialsRequest) returns (AuthReply);
  rpc VerifyEmail(VerifyEmailRequest) returns (AuthReply);
  rpc ResendVerification(EmailRequest) returns (AuthReply);
  rpc ForgotPassword(EmailRequest) returns (AuthReply);
  rpc ResetPassword(ResetPasswordRequest) returns (AuthReply);
  rpc Me(AccessRequest) returns (AuthReply);
  rpc Refresh(RefreshRequest) returns (AuthReply);
  rpc Logout(RefreshRequest) returns (AuthReply);
  rpc AdminListAccounts(AdminListAccountsRequest) returns (AuthReply);
  rpc AdminGetAccount(AdminGetAccountRequest) returns (AuthReply);
  rpc AdminUpdateAccount(AdminUpdateAccountRequest) returns (AuthReply);
  rpc AdminAccountAction(AdminAccountActionRequest) returns (AuthReply);
  rpc AdminAccountStats(AccessRequest) returns (AuthReply);
  rpc AdminListNotifications(AccessRequest) returns (AuthReply);
  rpc AdminMarkNotificationsRead(AdminMarkNotificationsReadRequest) returns (AuthReply);
  rpc AdminInviteAccount(AdminInviteAccountRequest) returns (AuthReply);
  rpc AcceptInvite(ResetPasswordRequest) returns (AuthReply);
  rpc UpdateProfile(UpdateProfileRequest) returns (AuthReply);
  rpc VerifyPassword(ChangePasswordRequest) returns (AuthReply);
  rpc ChangePassword(ChangePasswordRequest) returns (AuthReply);
  rpc UploadAvatar(UploadAvatarRequest) returns (AuthReply);
  rpc RemoveAvatar(AccessRequest) returns (AuthReply);
  rpc GetProfiles(GetProfilesRequest) returns (AuthReply);
  rpc Ready(ReadyRequest) returns (AuthReply);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string role = 3;
}

message CredentialsRequest {
  string email = 1;
  string password = 2;
}

message VerifyEmailRequest {
  string email = 1;
  string otp = 2;
}

message EmailRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string email = 1;
  string otp = 2;
  string password = 3;
}

message AccessRequest {
  string access_token = 1;
}

message RefreshRequest {
  string refresh_token = 1;
}

message AdminListAccountsRequest {
  string access_token = 1;
  map<string, string> query = 2;
}

message AdminGetAccountRequest {
  string access_token = 1;
  string account_id = 2;
}

message AdminUpdateAccountRequest {
  string access_token = 1;
  string account_id = 2;
  string role = 3;
  string status = 4;
  string reason = 5;
}

message AdminMarkNotificationsReadRequest {
  string access_token = 1;
  repeated string ids = 2;
}

message AdminAccountActionRequest {
  string access_token = 1;
  string account_id = 2;
  string action = 3;
  string reason = 4;
}

message AdminInviteAccountRequest {
  string access_token = 1;
  string email = 2;
  string display_name = 3;
  string role = 4;
}

message UpdateProfileRequest {
  string access_token = 1;
  string payload_json = 2;
}

message ChangePasswordRequest {
  string access_token = 1;
  string current_password = 2;
  string new_password = 3;
}

message UploadAvatarRequest {
  string access_token = 1;
  string file_name = 2;
  string mime_type = 3;
  bytes data = 4;
}

message GetProfilesRequest {
  repeated string account_ids = 1;
}

message ReadyRequest {}

message AuthReply {
  int32 http_status = 1;
  int32 code = 2;
  string msg = 3;
  string data_json = 4;
  repeated string set_cookies = 5;
}
