syntax = "proto3";

package appenglish.progress.v1;

service ProgressService {
  rpc GetProgress(ProgressRequest) returns (ProgressReply);
  rpc GetXp(ProgressRequest) returns (ProgressReply);
  rpc GetLeaderboard(ProgressRequest) returns (ProgressReply);
  rpc GetStreak(ProgressRequest) returns (ProgressReply);
  rpc GetLearnerSummary(ProgressRequest) returns (ProgressReply);
  rpc ListNotifications(ProgressRequest) returns (ProgressReply);
  rpc MarkNotificationsRead(ProgressRequest) returns (ProgressReply);
}

message Actor {
  string id = 1;
  string role = 2;
  string email = 3;
}

message ProgressRequest {
  Actor actor = 1;
  string id = 2;
  string payload_json = 3;
}

message ProgressReply {
  int32 http_status = 1;
  int32 code = 2;
  string msg = 3;
  string data_json = 4;
  repeated string set_cookies = 5;
}
