syntax = "proto3";

package appenglish.learning.v1;

service LearningService {
  rpc GetPlacement(LearningRequest) returns (LearningReply);
  rpc StartPlacement(LearningRequest) returns (LearningReply);
  rpc SavePlacementAnswers(LearningRequest) returns (LearningReply);
  rpc SubmitPlacement(LearningRequest) returns (LearningReply);
  rpc SkipPlacement(LearningRequest) returns (LearningReply);
  rpc GetPlacementSettings(LearningRequest) returns (LearningReply);
  rpc UpdatePlacementSettings(LearningRequest) returns (LearningReply);
  rpc AdminResetPlacement(LearningRequest) returns (LearningReply);
  rpc GetCurriculum(LearningRequest) returns (LearningReply);
  rpc GetLesson(LearningRequest) returns (LearningReply);
  rpc MarkVocabularyStudied(LearningRequest) returns (LearningReply);
  rpc GetVocabularyQuiz(LearningRequest) returns (LearningReply);
  rpc SubmitVocabularyQuiz(LearningRequest) returns (LearningReply);
  rpc SubmitFillIn(LearningRequest) returns (LearningReply);
  rpc GetLessonTest(LearningRequest) returns (LearningReply);
  rpc StartLessonTest(LearningRequest) returns (LearningReply);
  rpc SaveLessonTestAnswers(LearningRequest) returns (LearningReply);
  rpc SubmitLessonTest(LearningRequest) returns (LearningReply);
  rpc DiscardLessonTest(LearningRequest) returns (LearningReply);
  rpc GetLessonTestReview(LearningRequest) returns (LearningReply);
  rpc GetLessonRanking(LearningRequest) returns (LearningReply);
  rpc GetUnitReview(LearningRequest) returns (LearningReply);
  rpc SubmitUnitReview(LearningRequest) returns (LearningReply);
  rpc GetContentUsage(LearningRequest) returns (LearningReply);
  rpc GetVocabularyPractice(LearningRequest) returns (LearningReply);
  rpc CompleteVocabularyPractice(LearningRequest) returns (LearningReply);
  rpc ListListeningPractice(LearningRequest) returns (LearningReply);
  rpc GetListeningPractice(LearningRequest) returns (LearningReply);
  rpc CheckListeningPractice(LearningRequest) returns (LearningReply);
  rpc CheckListeningLine(LearningRequest) returns (LearningReply);
  rpc GetListeningTranscript(LearningRequest) returns (LearningReply);
  rpc GetListeningCourse(LearningRequest) returns (LearningReply);
  rpc GetCourseTopic(LearningRequest) returns (LearningReply);
  rpc CheckCourseSentence(LearningRequest) returns (LearningReply);
  rpc CompleteCourseTopic(LearningRequest) returns (LearningReply);
  rpc GetCourseTest(LearningRequest) returns (LearningReply);
  rpc SubmitCourseTest(LearningRequest) returns (LearningReply);
  rpc GetCourseProgress(LearningRequest) returns (LearningReply);
  rpc ListMockTests(LearningRequest) returns (LearningReply);
  rpc GetMockTest(LearningRequest) returns (LearningReply);
  rpc GetMockAttempt(LearningRequest) returns (LearningReply);
  rpc StartMockAttempt(LearningRequest) returns (LearningReply);
  rpc SaveMockAnswers(LearningRequest) returns (LearningReply);
  rpc SubmitMockAttempt(LearningRequest) returns (LearningReply);
  rpc DiscardMockAttempt(LearningRequest) returns (LearningReply);
  rpc GetMockReview(LearningRequest) returns (LearningReply);
  rpc GetMockStats(LearningRequest) returns (LearningReply);
  rpc GetStudyGoal(LearningRequest) returns (LearningReply);
  rpc SaveStudyGoal(LearningRequest) returns (LearningReply);
  rpc DeleteStudyGoal(LearningRequest) returns (LearningReply);
  rpc GetMockMistakes(LearningRequest) returns (LearningReply);
  rpc GetMistakePractice(LearningRequest) returns (LearningReply);
  rpc AnswerMistake(LearningRequest) returns (LearningReply);
  rpc GetScoreConversion(LearningRequest) returns (LearningReply);
  rpc UpdateScoreConversion(LearningRequest) returns (LearningReply);
  rpc ListSpeakingPrompts(LearningRequest) returns (LearningReply);
  rpc GetSpeakingPrompt(LearningRequest) returns (LearningReply);
  rpc SubmitSpeaking(RecordingRequest) returns (LearningReply);
  rpc GetSpeakingSubmission(LearningRequest) returns (LearningReply);
  rpc ListWritingPrompts(LearningRequest) returns (LearningReply);
  rpc GetWritingPrompt(LearningRequest) returns (LearningReply);
  rpc SubmitWriting(LearningRequest) returns (LearningReply);
  rpc GetWritingSubmission(LearningRequest) returns (LearningReply);
  rpc GetAiKey(LearningRequest) returns (LearningReply);
  rpc SaveAiKey(LearningRequest) returns (LearningReply);
  rpc DeleteAiKey(LearningRequest) returns (LearningReply);
  rpc SaveAiSettings(LearningRequest) returns (LearningReply);
  rpc ListAiModels(LearningRequest) returns (LearningReply);
  rpc GetReviewQuota(LearningRequest) returns (LearningReply);
  rpc RequestReview(LearningRequest) returns (LearningReply);
  rpc WithdrawReview(LearningRequest) returns (LearningReply);
  rpc ListReviewQueue(LearningRequest) returns (LearningReply);
  rpc ClaimReview(LearningRequest) returns (LearningReply);
  rpc GetReview(LearningRequest) returns (LearningReply);
  rpc ReleaseReview(LearningRequest) returns (LearningReply);
  rpc CompleteReview(LearningRequest) returns (LearningReply);
  rpc GetCefrProfile(LearningRequest) returns (LearningReply);
}

message Actor {
  string id = 1;
  string role = 2;
  string email = 3;
}

message LearningRequest {
  Actor actor = 1;
  string id = 2;
  string payload_json = 3;
}

message RecordingRequest {
  Actor actor = 1;
  string id = 2;
  string mime_type = 3;
  bytes data = 4;
  string payload_json = 5;
}

message LearningReply {
  int32 http_status = 1;
  int32 code = 2;
  string msg = 3;
  string data_json = 4;
  repeated string set_cookies = 5;
}
