syntax = "proto3";

package appenglish.content.v1;

service ContentService {
  rpc ListUnits(ContentRequest) returns (ContentReply);
  rpc CreateUnit(ContentRequest) returns (ContentReply);
  rpc UpdateUnit(ContentRequest) returns (ContentReply);
  rpc PublishUnit(ContentRequest) returns (ContentReply);
  rpc UnpublishUnit(ContentRequest) returns (ContentReply);
  rpc DeleteUnit(ContentRequest) returns (ContentReply);
  rpc GetUnitReview(ContentRequest) returns (ContentReply);
  rpc SaveUnitReviewDraft(ContentRequest) returns (ContentReply);
  rpc PublishUnitReview(ContentRequest) returns (ContentReply);
  rpc UnpublishUnitReview(ContentRequest) returns (ContentReply);
  rpc GetUnitReviewPaper(ContentRequest) returns (ContentReply);
  rpc CreateLesson(ContentRequest) returns (ContentReply);
  rpc UpdateLesson(ContentRequest) returns (ContentReply);
  rpc GetLesson(ContentRequest) returns (ContentReply);
  rpc SaveLessonDraft(ContentRequest) returns (ContentReply);
  rpc PublishLesson(ContentRequest) returns (ContentReply);
  rpc UnpublishLesson(ContentRequest) returns (ContentReply);
  rpc DeleteLesson(ContentRequest) returns (ContentReply);
  rpc UploadMedia(UploadMediaRequest) returns (ContentReply);
  rpc AutofillPronunciation(ContentRequest) returns (ContentReply);
  rpc DeleteMedia(ContentRequest) returns (ContentReply);
  rpc ListOrphanMedia(ContentRequest) returns (ContentReply);
  rpc DeleteOrphanMedia(ContentRequest) returns (ContentReply);
  rpc GetPlacement(ContentRequest) returns (ContentReply);
  rpc SavePlacementDraft(ContentRequest) returns (ContentReply);
  rpc PublishPlacement(ContentRequest) returns (ContentReply);
  rpc GetPlacementPaper(ContentRequest) returns (ContentReply);
  rpc GetCurriculum(ContentRequest) returns (ContentReply);
  rpc GetLessonPaper(ContentRequest) returns (ContentReply);
  rpc ListExamTypes(ContentRequest) returns (ContentReply);
  rpc CreateExamType(ContentRequest) returns (ContentReply);
  rpc UpdateExamType(ContentRequest) returns (ContentReply);
  rpc ListMockTests(ContentRequest) returns (ContentReply);
  rpc CreateMockTest(ContentRequest) returns (ContentReply);
  rpc UpdateMockTest(ContentRequest) returns (ContentReply);
  rpc GetMockTest(ContentRequest) returns (ContentReply);
  rpc SaveMockTestDraft(ContentRequest) returns (ContentReply);
  rpc PublishMockTest(ContentRequest) returns (ContentReply);
  rpc UnpublishMockTest(ContentRequest) returns (ContentReply);
  rpc DeleteMockTest(ContentRequest) returns (ContentReply);
  rpc ListPublishedMockTests(ContentRequest) returns (ContentReply);
  rpc GetMockPaper(ContentRequest) returns (ContentReply);
  rpc ListListeningTopics(ContentRequest) returns (ContentReply);
  rpc CreateListeningTopic(ContentRequest) returns (ContentReply);
  rpc UpdateListeningTopic(ContentRequest) returns (ContentReply);
  rpc DeleteListeningTopic(ContentRequest) returns (ContentReply);
  rpc RequestMockTranscribe(ContentRequest) returns (ContentReply);
  rpc ListMockTranscribe(ContentRequest) returns (ContentReply);
  rpc ListContentNotifications(ContentRequest) returns (ContentReply);
  rpc MarkContentNotificationsRead(ContentRequest) returns (ContentReply);
  rpc ListAdminContentNotifications(ContentRequest) returns (ContentReply);
  rpc MarkAdminContentNotificationsRead(ContentRequest) returns (ContentReply);
  rpc ListListeningExercises(ContentRequest) returns (ContentReply);
  rpc CreateListeningExercise(ContentRequest) returns (ContentReply);
  rpc UpdateListeningExercise(ContentRequest) returns (ContentReply);
  rpc GetListeningExercise(ContentRequest) returns (ContentReply);
  rpc SaveListeningExerciseDraft(ContentRequest) returns (ContentReply);
  rpc PublishListeningExercise(ContentRequest) returns (ContentReply);
  rpc UnpublishListeningExercise(ContentRequest) returns (ContentReply);
  rpc DeleteListeningExercise(ContentRequest) returns (ContentReply);
  rpc ListPublishedListeningExercises(ContentRequest) returns (ContentReply);
  rpc GetListeningPaper(ContentRequest) returns (ContentReply);
  rpc RequestListeningAutoTime(ContentRequest) returns (ContentReply);
  rpc GetListeningAutoTime(ContentRequest) returns (ContentReply);
  rpc RequestListeningTranscribe(ContentRequest) returns (ContentReply);
  rpc ListListeningCourse(ContentRequest) returns (ContentReply);
  rpc CreateCourseItem(ContentRequest) returns (ContentReply);
  rpc UpdateCourseItem(ContentRequest) returns (ContentReply);
  rpc GetCourseItem(ContentRequest) returns (ContentReply);
  rpc SaveCourseItemDraft(ContentRequest) returns (ContentReply);
  rpc PublishCourseItem(ContentRequest) returns (ContentReply);
  rpc UnpublishCourseItem(ContentRequest) returns (ContentReply);
  rpc DeleteCourseItem(ContentRequest) returns (ContentReply);
  rpc RequestCourseAutoTime(ContentRequest) returns (ContentReply);
  rpc RequestCourseTranscribe(ContentRequest) returns (ContentReply);
  rpc GetCourseAutoTime(ContentRequest) returns (ContentReply);
  rpc ListPublishedCourse(ContentRequest) returns (ContentReply);
  rpc GetCoursePaper(ContentRequest) returns (ContentReply);
  rpc ListContentVersions(ContentRequest) returns (ContentReply);
  rpc GetContentVersion(ContentRequest) returns (ContentReply);
  rpc RestoreContentVersion(ContentRequest) returns (ContentReply);
  rpc DiscardContentDraft(ContentRequest) returns (ContentReply);
  rpc DeleteContentVersion(ContentRequest) returns (ContentReply);
}

message Actor {
  string id = 1;
  string role = 2;
}

message ContentRequest {
  Actor actor = 1;
  string id = 2;
  string payload_json = 3;
}

message UploadMediaRequest {
  Actor actor = 1;
  string kind = 2;
  string file_name = 3;
  string mime_type = 4;
  bytes data = 5;
  string lesson_id = 6;
  string section = 7;
}

message ContentReply {
  int32 http_status = 1;
  int32 code = 2;
  string msg = 3;
  string data_json = 4;
  repeated string set_cookies = 5;
}
