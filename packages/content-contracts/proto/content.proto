  rpc ListContentReviews(ContentRequest) returns (ContentReply);
  rpc SubmitContentReview(ContentRequest) returns (ContentReply);
  rpc WithdrawContentReview(ContentRequest) returns (ContentReply);
  rpc ApproveContentReview(ContentRequest) returns (ContentReply);
  rpc ReturnContentReview(ContentRequest) returns (ContentReply);
}

message Actor {
  string id = 1;
  string role = 2;
}

message ContentRequest {
  Actor actor = 1;
  string id = 2;
  string payload_json = 3;
}

message UploadMediaRequest {
  Actor actor = 1;
  string kind = 2;
  string file_name = 3;
  string mime_type = 4;
  bytes data = 5;
  string lesson_id = 6;
  string section = 7;
}

message ContentReply {
  int32 http_status = 1;
  int32 code = 2;
  string msg = 3;
  string data_json = 4;
  repeated string set_cookies = 5;
}
